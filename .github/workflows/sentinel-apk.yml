name: Build Sentinel APK

# Builds the KODA Sentinel Android app and publishes an installable APK to a
# GitHub Release, so Kinshasa testers can download it from one stable link
# (kodajnn.com/sentinel points here). Also builds the Play Store AAB.
#
# SIGNING: if the repo has secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
# KEY_ALIAS / KEY_PASSWORD, the release is signed with your upload key. Without
# them it falls back to the debug key — still installable for side-load pilots.

on:
  workflow_dispatch:
  push:
    paths:
      - 'sentinel/**'
      - '.github/workflows/sentinel-apk.yml'

permissions:
  contents: write        # needed to publish the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore (if provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/koda-upload.jks"
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK + AAB
        working-directory: sentinel
        env:
          KODA_KEYSTORE_FILE: ${{ steps.keystore.outputs.have_keystore == 'true' && format('{0}/koda-upload.jks', runner.temp) || '' }}
          KODA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KODA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KODA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleSideloadRelease :app:assemblePlayRelease :app:bundlePlayRelease

      - name: Stage artifacts
        run: |
          mkdir -p dist
          # sideload APK = direct-download build that READS SMS (max reliability, more Play Protect friction)
          cp sentinel/app/build/outputs/apk/sideload/release/*.apk dist/koda-sentinel.apk
          # play APK = direct-download build that reads the NOTIFICATION (no SMS permission → easier side-load)
          cp sentinel/app/build/outputs/apk/play/release/*.apk dist/koda-sentinel-notify.apk
          # play AAB = the same notification build, for uploading to the Google Play Store
          cp sentinel/app/build/outputs/bundle/playRelease/*.aab dist/koda-sentinel-play.aab || true
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koda-sentinel
          path: dist/*
          if-no-files-found: error

      - name: Publish to a stable Release (sentinel-latest)
        if: github.ref_name == 'claude/koda-unified-spec-v2-vh5xtx' || github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sentinel-latest
          name: KODA Sentinel (latest)
          body: |
            Latest KODA Sentinel builds.
            · koda-sentinel.apk — reads the SMS (max reliability + inbox back-fill); more Play Protect friction.
            · koda-sentinel-notify.apk — reads the payment NOTIFICATION (no SMS permission → installs far more easily).
            · koda-sentinel-play.aab — the notification build, for uploading to Google Play.
            Signed: ${{ steps.keystore.outputs.have_keystore == 'true' && 'release upload key' || 'debug key (side-load pilot)' }}.
            Download page: https://kodajnn.com/sentinel
          files: |
            dist/koda-sentinel.apk
            dist/koda-sentinel-notify.apk
            dist/koda-sentinel-play.aab
          make_latest: 'true'
