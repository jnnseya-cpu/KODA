name: Build Sentinel APK

# Builds the KODA Sentinel Android app into an installable APK you can download
# and side-load on a merchant's SIM phone — no local Android Studio needed.
#
# Run it: GitHub → Actions → "Build Sentinel APK" → Run workflow.
# Then open the finished run → Artifacts → download "koda-sentinel-debug-apk".
#
# The DEBUG apk is self-signed (Android's debug key) — perfect for side-loading
# and the first real Door 1 test. For the Play Store, add a release keystore and
# switch to :app:bundleRelease (see sentinel/README.md).

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    paths:
      - 'sentinel/**'
      - '.github/workflows/sentinel-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: sentinel
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: koda-sentinel-debug-apk
          path: sentinel/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
