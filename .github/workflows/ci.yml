name: KODA CI

# The whole gate that keeps the money path honest. Zero npm deps, so there is
# nothing to install — just Node 22 and the test suites.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:      # "Run workflow" button — re-run the test gate on demand

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # CI-only: the server refuses to boot with a known dev secret unless this is set.
      # Every test harness that spawns its own server already sets it; the manually
      # booted server below needs it too, or /readyz never comes up and the job fails.
      KODA_ALLOW_DEV_SECRET: "1"
      # CI-only: allow the TEST-* sandbox verification refs (never set in production).
      KODA_ALLOW_SANDBOX_REFS: "1"
      # Mock operator-API adapter so the dual-confirm (crosscheck) path is exercised
      # (mirrors launch-audit.sh). Only activates when a crosscheck is invoked.
      KODA_OPAPI_ORANGE_CD: "mock://confirm"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show Node version (need >= 22.5 for node:sqlite)
        run: node --version

      # self-hosted unit suite (boots its own server on an isolated port) + margin law
      - name: Unit + margin gate
        run: npm test

      # HTTP suites need a running instance — boot one, wait for health, run them
      - name: Boot server
        run: |
          KODA_QUIET=1 KODA_DATA_DIR="$(mktemp -d)" node --no-warnings backend/server.js &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            curl -sf http://localhost:4600/readyz >/dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:4600/version

      - name: Security / adversarial
        run: node --no-warnings backend/tools/test-adversarial.js

      - name: AI gating (no free AI action)
        run: node --no-warnings backend/tools/test-ai-gating.js

      - name: Growth engine
        run: node --no-warnings backend/tools/test-growth.js

      - name: Checkout end-to-end
        run: node --no-warnings backend/tools/test-checkout.js

      - name: Busy-merchant fraud regression
        run: node --no-warnings backend/tools/test-busy-merchant.js

      # Self-boots its own production-like server (sandbox refs OFF) — proves TEST-* codes
      # cannot verify a live order.
      - name: Sandbox-reference gate (security)
        run: node --no-warnings backend/tools/test-sandbox-gate.js

      # Money-path & DR suites — previously ran ONLY in the local launch-audit, so a fresh
      # push had far thinner financial coverage than the audit implied. These are
      # in-process / self-booting (no shared server needed).
      - name: Money-path & DR suites
        run: |
          node --no-warnings backend/tools/test-agents.js
          node --no-warnings backend/tools/test-backup-restore.js
          node --no-warnings backend/tools/test-backup.js
          node --no-warnings backend/tools/test-billing-webhook.js
          node --no-warnings backend/tools/test-billing.js
          node --no-warnings backend/tools/test-rails.js
          node --no-warnings backend/tools/test-comms.js
          node --no-warnings backend/tools/test-networks.js

      # Functional / doors / add-ons / human-gate — drive the shared server booted above.
      - name: Functional & security suites
        env:
          KODA_BASE: http://localhost:4600
        run: |
          node --no-warnings backend/tools/test-doors.js
          node --no-warnings backend/tools/test-full-os.js
          node --no-warnings backend/tools/test-addons.js
          node --no-warnings backend/tools/test-security.js

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true
