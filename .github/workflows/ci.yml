name: KODA CI

# The whole gate that keeps the money path honest. Zero npm deps, so there is
# nothing to install — just Node 22 and the test suites.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show Node version (need >= 22.5 for node:sqlite)
        run: node --version

      # self-hosted unit suite (boots its own server on an isolated port) + margin law
      - name: Unit + margin gate
        run: npm test

      # HTTP suites need a running instance — boot one, wait for health, run them
      - name: Boot server
        run: |
          KODA_QUIET=1 node --no-warnings backend/server.js &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            curl -sf http://localhost:4600/readyz >/dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:4600/version

      - name: Security / adversarial
        run: node --no-warnings backend/tools/adversarial.js

      - name: AI gating (no free AI action)
        run: node --no-warnings backend/tools/test-ai-gating.js

      - name: Growth engine
        run: node --no-warnings backend/tools/test-growth.js

      - name: Checkout end-to-end
        run: node --no-warnings backend/tools/test-checkout.js

      - name: Busy-merchant fraud regression
        run: node --no-warnings backend/tools/test-busy-merchant.js

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

  # ── Auto-deploy: once the gate is green on the deploy branch, ship to the VPS ──
  # Requires repo secrets: VPS_SSH_KEY (private key), VPS_HOST, VPS_USER, and
  # optionally VPS_APP_DIR. Without them the job no-ops with a warning (never red).
  # See DEPLOY_AUTODEPLOY.md for the one-time SSH-key + secrets setup.
  deploy:
    name: Deploy to VPS
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/koda-unified-spec-v2-vh5xtx'
    runs-on: ubuntu-latest
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      - name: Ship over SSH (pull → build → health-check; IndexNow re-pings on boot)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          if [ -z "${SSH_KEY:-}" ] || [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ]; then
            echo "::warning::VPS deploy secrets not set (VPS_SSH_KEY/VPS_HOST/VPS_USER) — skipping auto-deploy. See DEPLOY_AUTODEPLOY.md."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          BR='claude/koda-unified-spec-v2-vh5xtx'
          DIR="${APP_DIR:-/root/koda/app}"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            "set -e; cd '$DIR'; git fetch origin; git checkout '$BR'; git pull --ff-only origin '$BR'; bash deploy/vps-deploy.sh"
